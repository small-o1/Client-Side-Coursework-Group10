<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserve a Book - UniLibrary</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
</head>
<body>
    <header class="navbar">
        <div class="container nav-container">
            <div class="logo">UniLibrary</div>
            <nav>
                <a href="index.html">Home</a>
                <a href="catalog.html">Search Catalog</a>
                <a href="reservations.html" class="active">My Reservations</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="reservation-section container">
            <h1>Reserve a Book</h1>
            <p>Fill out the form below to reserve a title for pickup at the circulation desk.</p>

            <form id="reservation-form" class="reservation-form" action="#" method="POST">
                <div class="form-group">
                    <label for="book-select">Select a Book</label>
                    <select id="book-select" name="book" required>
                        <option value="" disabled selected>-- Choose a title --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="full-name">Full Name:</label>
                    <input type="text" id="full-name" name="name" placeholder="Jane Doe" required>
                </div>

                <div class="form-group">
                    <label for="address">Address:</label>
                    <textarea id="address" name="address" placeholder="123 Library Lane, Cityville, ST 12345" required></textarea>
                </div>
                
                <button type="submit" class="btn-submit">Submit Reservation</button>
            </form>

            <div id="confirmation-message"></div>
        </section>

        <section class="my-reservations container">
            <h2>My Reservations</h2>
            <div id="reservations-list"></div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 UniLibrary — Group 10 Client-Side Coursework</p>
        </div>
    </footer>

    <script src="js/catalog.js"></script>
    <script src="js/reservations.js"></script>
</body>
</html>
